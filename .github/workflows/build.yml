name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Make a release with this version tag, e.g. v0.1.0 (empty: just build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  EASYPDK_COMMIT: c24616d   # keep in sync with packaging/build.py

jobs:
  linux:
    runs-on: ubuntu-22.04     # older glibc: the binary runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dfu-util libusb-1.0-0 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3
      - run: pip install pyside6 pyinstaller pytest
      - name: Tools (SDCC, easypdkprog, dfu-util)
        run: python packaging/build.py --tools
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q tests
      - name: Executable
        run: python packaging/build.py
      - name: Try the executable
        run: |
          dist/padauk-studio check
          dist/padauk-studio new /tmp/p -c PFS154 -e serial_hello
          dist/padauk-studio build /tmp/p
      - uses: actions/upload-artifact@v4
        with:
          name: padauk-studio-linux
          path: dist/padauk-studio

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32   # 32-bit: easypdkprog keeps Windows handles in an int
          install: mingw-w64-i686-gcc make git diffutils
      - name: easypdkprog (PoGo430 fork, native PFS122)
        shell: msys2 {0}
        run: |
          git clone https://github.com/PoGo430/easy-pdk-programmer-software.git packaging/work/easy-pdk-programmer-software
          cd packaging/work/easy-pdk-programmer-software
          git checkout -q $EASYPDK_COMMIT
          make easypdkprog LDFLAGS=-static
          mkdir -p ../../tools-windows
          cp easypdkprog.exe ../../tools-windows/
          cp LICENSE ../../tools-windows/easypdkprog-LICENSE.txt
          cmp Firmware/EASYPDKPROG_1.4.dfu ../../../padauk_studio/firmware/EASYPDKPROG_1.4.dfu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyside6 pyinstaller pytest
      - name: Tools (SDCC, dfu-util)
        run: python packaging/build.py --tools
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Executable
        run: python packaging/build.py
      - name: Try the executable
        shell: bash
        run: |
          dist/padauk-studio.exe check
          dist/padauk-studio.exe new "$RUNNER_TEMP/p" -c PFS122 -e adc_serial
          dist/padauk-studio.exe build "$RUNNER_TEMP/p"
      - uses: actions/upload-artifact@v4
        with:
          name: padauk-studio-windows
          path: dist/padauk-studio.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Padauk Studio ${{ inputs.release || github.ref_name }}
          prerelease: ${{ startsWith(inputs.release || github.ref_name, 'v0.') }}   # not tested on hardware yet
          generate_release_notes: true
          files: |
            padauk-studio-linux/padauk-studio
            padauk-studio-windows/padauk-studio.exe
