name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDCC
        run: sudo apt-get update && sudo apt-get install -y sdcc
      - name: Build template + examples (PFS154, PFS122, PMS150C)
        run: tools/test-all.sh
      - name: Build template for every supported device
        run: |
          for d in $(make -s -C template devices | awk 'NR > 1 {print $1}'); do
            make -s -C template DEVICE=$d build >/dev/null && echo "ok $d" || exit 1
          done
      - name: pdk tool smoke test
        run: |
          ./pdk new /tmp/ci-proj -d PFS122 -e serial_hello --no-code
          cd /tmp/ci-proj
          $GITHUB_WORKSPACE/pdk set clock=4M vdd=3.3
          $GITHUB_WORKSPACE/pdk build
          grep -q "define F_CPU 4000000" .vscode/pdk_config.h
          $GITHUB_WORKSPACE/pdk upgrade
          $GITHUB_WORKSPACE/pdk build
      - name: GUI starts
        run: |
          pip install PyQt5
          QT_QPA_PLATFORM=offscreen python3 -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('gui', 'PadaukBuilder/Padauk Tools.py')
          g = importlib.util.module_from_spec(spec); spec.loader.exec_module(g)
          app = g.QApplication(sys.argv); w = g.MainWindow('/tmp/ci-proj'); print('GUI ok:', w.project)"
      - name: VS Code JSON files are valid
        run: |
          for f in template/.vscode/*.json; do
            python3 -c "import json,re,sys; json.loads(re.sub(r'(?m)^\\s*//.*$', '', open(sys.argv[1]).read()))" "$f" && echo "ok $f"
          done
